name: Terraform sandbox-market-data

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for apply"
        required: true
        type: choice
        options: [dev, stg, prod]

jobs:
  plan:
    uses: ./.github/workflows/_terraform-reusable-sandbox.yml
    with:
      sandbox: sandbox-market-data
      working_dir: sandbox-market-data/terraform
    secrets: inherit
